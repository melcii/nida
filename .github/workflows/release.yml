# Builds NİDÂ (APK for direct download, App Bundle for Google Play), signs both with the release key kept in repository secrets, and publishes it.
#   Push a tag like v0.2  -> a GitHub Release with the signed APK attached.
#   Run it by hand        -> a signed APK as a downloadable build artifact (no release).
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore the signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without the real key the build would quietly fall back to a debug key, and
          # people could not update over earlier versions. Stop instead.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the signed APK and App Bundle
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Check the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          certs="$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)"
          echo "$certs" | grep -E "DN|SHA-256"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The APK was signed with a debug key, not the release key."
            exit 1
          fi
          if keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -q "CN=Android Debug"; then
            echo "::error::The App Bundle was signed with a debug key, not the release key."
            exit 1
          fi

      - name: Name the files
        run: |
          name="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/release/app-release.apk "NIDA-$name.apk"
          cp app/build/outputs/bundle/release/app-release.aab "NIDA-$name.aab"
          echo "APK=NIDA-$name.apk" >> "$GITHUB_ENV"
          echo "AAB=NIDA-$name.aab" >> "$GITHUB_ENV"

      - name: Keep the key off the runner
        if: always()
        run: rm -f keystore/release.jks keystore.properties

      - uses: actions/upload-artifact@v7
        with:
          name: NIDA-${{ github.ref_name }}
          path: |
            ${{ env.APK }}
            ${{ env.AAB }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$AAB" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$AAB" --title "NİDÂ $GITHUB_REF_NAME" --generate-notes
          fi
